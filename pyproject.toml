[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "macro-agents"
version = "1.0.0"
description = "A compact five-agent deliberation CLI with shared memory"
requires-python = ">=3.10"
license = {text = "MIT"}

[project.scripts]
macro-agents = "orchestrator:main"

[tool.setuptools]
py-modules = ["orchestrator", "memory", "learning"]
